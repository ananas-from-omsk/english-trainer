<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить слово</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">➕ Добавить новое слово</h1>

    <form method="post" class="card bg-secondary p-4">
        {% csrf_token %}

        <div class="mb-3">
            <label>English</label>
            {{ form.english }}
            {{ form.english.errors }}
        </div>

        <div class="mb-3">
            <label>Russian</label>
            {{ form.russian }}
            {{ form.russian.errors }}
        </div>

        <div class="mb-3">
            <label>Example</label>
            {{ form.example }}
        </div>

        <button class="btn btn-success">Сохранить</button>
        <a href="/" class="btn btn-light">Назад</a>
    </form>

</div>

</body>
</html>
