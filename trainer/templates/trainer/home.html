<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>English Trainer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">

    <!-- Навигация -->
    <nav class="mb-4">
        <a href="/" class="text-light">Главная</a> |
        <a href="/train/" class="text-light">Тренировка</a> |
        <a href="/stats/" class="text-light">Статистика</a> |
        <a href="/add/" class="text-light">Добавить слово</a> |
    </nav>

    <h1 class="mb-4 text-center"> 📚 Мои слова</h1>

    <div class="row">

        {% for word in words %}

        <div class="col-md-4 mb-3">

            <div class="card bg-secondary text-light h-100">

                <div class="card-body">

                    <h3>{{ word.english }}</h3>

                    <p><b>Перевод:</b> {{ word.russian }}</p>

                    <p><i>{{ word.example }}</i></p>

                </div>

            </div>

        </div>

        {% empty %}

        <p>Слов пока нет</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
